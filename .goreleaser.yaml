---
version: 2
project_name: offscreen

before:
  hooks:
    # Builds app/.build/Offscreen.app (Swift 6.2+) stamped with the version the
    # Go binaries get, so the menu can tell when the daemon is stale.
    - app/scripts/bundle.sh {{ .Version }}

builds:
  - id: offscreen
    main: ./cmd/offscreen
    binary: offscreen
    ldflags:
      - -s -w -X github.com/markphelps/offscreen/internal/version.Build={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
  - id: offscreend
    main: ./cmd/offscreend
    binary: offscreend
    ldflags:
      - -s -w -X github.com/markphelps/offscreen/internal/version.Build={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]

archives:
  - id: offscreen
    ids: [offscreen, offscreend]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: app/.build/Offscreen.app
        dst: Offscreen.app

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: offscreen
    ids: [offscreen]
    homepage: https://github.com/markphelps/offscreen
    description: Run Mac GUI jobs in disposable virtual machines
    directory: Casks
    url:
      template: "https://github.com/markphelps/offscreen/releases/download/\
        {{ .Tag }}/{{ .ArtifactName }}"
    binaries:
      - offscreen
      - offscreend
    repository:
      owner: markphelps
      name: homebrew-tap
      branch: main
    hooks:
      post:
        install: |
          if OS.mac?
            ["offscreen", "offscreend"].each do |binary|
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine",
                                    "#{staged_path}/#{binary}"]
            end
          end
