version: "2"

run:
  timeout: 5m

linters:
  enable:
    - asciicheck
    - bidichk
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - modernize
    - nilerr
    - staticcheck
    - testifylint
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G115
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
