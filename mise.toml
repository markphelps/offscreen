[tools]
go = "1.27.0"
golangci-lint = "2.13.2"
shellcheck = "0.11.0"
goreleaser = "2.17.1"

# Tasks are named <verb> or <verb>:<part>. Each bare verb runs all its parts.

[tasks.install]
description = "Install the CLI, daemon and Offscreen menu bar app"
run = [{ task = "install:go" }, { task = "install:helper" }]

[tasks."install:go"]
description = "Install offscreen and offscreend in ~/.local/bin (or $OFFSCREEN_BIN_DIR) and start the daemon"
run = "scripts/install.sh"

[tasks."install:helper"]
description = "Bundle the Offscreen menu bar app and install its LaunchAgent"
run = [{ task = "build:app" }, "app/scripts/install.sh"]

[tasks.uninstall]
description = "Remove the daemon, menu bar app and installed binaries"
run = ["scripts/install.sh uninstall", "app/scripts/install.sh uninstall"]

[tasks.build]
description = "Build everything without installing"
run = [{ task = "build:go" }, { task = "build:app" }]

[tasks."build:go"]
description = "Build bin/offscreen and bin/offscreend"
run = "mkdir -p bin && go build -o bin/offscreen ./cmd/offscreen && go build -o bin/offscreend ./cmd/offscreend && go build ./..."

[tasks."build:app"]
description = "Build and bundle the Offscreen menu bar app into app/.build"
run = "swift build --package-path app && app/scripts/bundle.sh"

[tasks.test]
description = "Run all tests"
run = [{ task = "test:go" }, { task = "test:app" }]

[tasks."test:go"]
description = "Run Go tests"
run = "go test ./..."

[tasks."test:app"]
description = "Unit-test the Swift menu bar app (no bundling, install or permissions)"
run = "swift build --package-path app && swift test --package-path app"

[tasks.lint]
description = "Run all linters"
run = [{ task = "lint:go" }, { task = "lint:sh" }]

[tasks."lint:go"]
description = "Lint Go code"
run = "golangci-lint run ./..."

[tasks."lint:sh"]
description = "ShellCheck every tracked shell script"
run = "git ls-files -z '*.sh' | xargs -0 shellcheck"

[tasks.fmt]
description = "Format Go code and apply modern Go idioms (edits files)"
run = ["golangci-lint fmt ./...", "golangci-lint run --default=none -E modernize --fix ./..."]

[tasks.check]
description = "Everything to run before committing: lint, test, build"
run = [{ task = "lint" }, { task = "test" }, { task = "build:go" }]
