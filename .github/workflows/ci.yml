name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Lint
        run: mise run lint:go
      - name: Unit tests
        run: mise run test:go
      # Guards the C04 fix: guardian subprocesses must keep coverage warnings out of task output.
      - name: Coverage-instrumented guardian tests
        run: go test ./internal/run -cover -count=1

  helper:
    # Package.swift needs Swift 6.2; macos-26's default Xcode provides it.
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
      # Builds and runs the pure XCTest suite only: no bundle, install or launch.
      - name: Swift helper build and unit tests
        run: mise run test:helper

  shellcheck:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install_args: shellcheck
      - name: ShellCheck
        run: mise run lint:sh
