name: CI

on:
  push:
  pull_request:

jobs:
  # Go and shell linting need no Mac. The Go code is macOS-only but has no cgo,
  # so golangci-lint type-checks it for darwin from Linux. Swift lint runs in
  # the macOS test job, where the toolchain that builds swift-format lives.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install_args: go golangci-lint shellcheck
      - name: Go lint (GOOS=darwin)
        run: mise run lint:go
        env:
          GOOS: darwin
      - name: ShellCheck
        if: ${{ !cancelled() }}
        run: mise run lint:sh

  # The tests need a Mac: internal/run's process guardian is darwin-only, so
  # most Go packages' tests do not compile for Linux, and the menu bar app is
  # Swift for macOS. One job, so a run pays for one macOS runner. It also runs
  # lint:app, since swift-format needs the Swift toolchain.
  test:
    # Package.swift needs Swift 6.2; macos-26's default Xcode provides it.
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          # mise builds swift-format from source; the action caches the result.
          install_args: go spm:swiftlang/swift-format
      - name: Go unit tests
        run: mise run test:go
      # Guards the C04 fix: guardian subprocesses must keep coverage warnings out of task output.
      - name: Coverage-instrumented guardian tests
        run: go test ./internal/run -cover -count=1
      # Builds and runs the pure XCTest suite only: no bundle, install or launch.
      - name: Swift app build and unit tests
        if: ${{ !cancelled() }}
        run: mise run test:app
      - name: Swift lint
        if: ${{ !cancelled() }}
        run: mise run lint:app
